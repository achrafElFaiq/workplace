server {
    listen 80;

    # Portal
    location / {
        proxy_pass http://portal:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # MCP server (SSE + messages)
    location /mcp/ {
        proxy_pass http://portal:8510/;
        proxy_set_header Host portal:8510;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }
    location /messages/ {
        proxy_pass http://portal:8510/messages/;
        proxy_set_header Host portal:8510;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # budget
    location /tools/budget/ {
        resolver 127.0.0.11 valid=5s;
        set $upstream_budget http://budget:8501;
        rewrite ^/tools/budget/(.*)$ /$1 break;
        proxy_pass $upstream_budget;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # calendar
    location /tools/calendar/ {
        resolver 127.0.0.11 valid=5s;
        set $upstream_calendar http://calendar:8501;
        rewrite ^/tools/calendar/(.*)$ /$1 break;
        proxy_pass $upstream_calendar;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # email-reader
    location /tools/email-reader/ {
        resolver 127.0.0.11 valid=5s;
        set $upstream_email_reader http://email-reader:8501;
        rewrite ^/tools/email-reader/(.*)$ /$1 break;
        proxy_pass $upstream_email_reader;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # job-tracker
    location /tools/job-tracker/ {
        resolver 127.0.0.11 valid=5s;
        set $upstream_job_tracker http://job-tracker:8501;
        rewrite ^/tools/job-tracker/(.*)$ /$1 break;
        proxy_pass $upstream_job_tracker;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # mock-tool
    location /tools/mock-tool/ {
        resolver 127.0.0.11 valid=5s;
        set $upstream_mock_tool http://mock-tool:8501;
        rewrite ^/tools/mock-tool/(.*)$ /$1 break;
        proxy_pass $upstream_mock_tool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # todolist
    location /tools/todolist/ {
        resolver 127.0.0.11 valid=5s;
        set $upstream_todolist http://todolist:8501;
        rewrite ^/tools/todolist/(.*)$ /$1 break;
        proxy_pass $upstream_todolist;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
