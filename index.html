<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #fafaf5;
            --bg-secondary: #f0f0e8;
            --primary: #2d6a4f;
            --primary-hover: #1b4332;
            --text: #1a1a1a;
            --text-muted: #888888;
            --border: #d4d4c8;
            --border-light: #eeeeee;
            --r: 6px;
        }

        html, body {
            height: 100%;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        /* ── Home ──────────────────────────── */
        .home {
            padding: 32px 24px;
            height: 100vh;
            overflow-y: auto;
        }

        .title {
            font-size: 36px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 56px;
        }
        .title span { color: var(--primary); }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 20px;
            min-height: 120px;
            background: var(--bg);
            text-decoration: none;
            cursor: pointer;
            transition: border-color 0.15s;
        }
        .card:hover { border-color: var(--primary); }
        .card { position: relative; }

        .card-close {
            position: absolute;
            top: 8px;
            right: 8px;
            background: none;
            border: none;
            font-family: inherit;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 3px;
            opacity: 0;
            transition: opacity 0.15s, color 0.15s;
        }
        .card:hover .card-close { opacity: 1; }
        .card-close:hover { color: #c0392b; }

        .card-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .card-desc {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
            flex: 1;
        }

        .card-arrow {
            font-size: 18px;
            color: var(--primary);
            text-align: right;
            margin-top: 12px;
        }

        /* ── Browse marketplace button ─────── */
        .btn-add {
            position: fixed;
            top: 40px;
            right: 24px;
            z-index: 9998;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border: 1px dashed var(--border);
            border-radius: var(--r);
            background: var(--bg);
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            cursor: pointer;
            transition: border-color 0.15s;
        }
        .btn-add:hover { border-color: var(--primary); }

        /* ── Frame (tool view) ─────────────── */
        .frame { display: none; }
        .frame.active { display: block; }
        .home.hidden { display: none; }

        .bar-top {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            z-index: 9999;
        }

        .bar-back {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
        }
        .bar-back:hover { color: var(--primary-hover); }

        .bar-name {
            font-size: 13px;
            color: #555;
        }

        .bar-spacer {
            font-size: 12px;
            font-weight: 700;
            visibility: hidden;
        }

        .bar-bottom {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 25px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            z-index: 9999;
        }

        .tool-iframe {
            position: fixed;
            top: 46px;
            left: 0;
            right: 0;
            bottom: 25px;
            width: 100%;
            height: calc(100vh - 71px);
            border: none;
            background: var(--bg);
        }

        /* ── Marketplace expand ─────────────── */
        .market-overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;
            pointer-events: none;
        }
        .market-overlay.active { pointer-events: auto; }

        .market-panel {
            position: fixed;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--r);
            z-index: 10001;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.15, 1);
            display: none;
        }
        .market-panel.visible { display: block; }
        .market-panel.expanded { border-radius: 0; border: none; }

        .market-content {
            opacity: 0;
            padding: 28px;
            height: 100%;
            overflow: hidden;
            transition: opacity 0.2s ease 0.25s;
        }
        .market-panel.expanded .market-content { opacity: 1; overflow-y: auto; }

        .market-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }
        .market-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
        }
        .market-close {
            padding: 4px 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: transparent;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
        }
        .market-close:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* ── Marketplace grid ──────────────── */
        .market-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .market-card {
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 20px;
            background: var(--bg);
        }

        .market-card-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }

        .market-card-desc {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .market-card-actions {
            display: flex;
            gap: 8px;
        }

        .btn-install, .btn-uninstall {
            padding: 6px 14px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid var(--primary);
        }

        .btn-install {
            background: var(--primary);
            color: var(--bg);
        }
        .btn-install:hover { background: var(--primary-hover); border-color: var(--primary-hover); }

        .btn-uninstall {
            background: transparent;
            color: var(--primary);
        }
        .btn-uninstall:hover { background: var(--bg-secondary); }

        .btn-install:disabled, .btn-uninstall:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .market-card-status {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .market-empty {
            text-align: center;
            padding: 80px 24px;
        }
        .market-empty .ic {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-muted);
        }
        .market-empty .h {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            margin-top: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid var(--bg);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 4px;
        }
        .spinner-dark {
            border-color: var(--primary);
            border-top-color: transparent;
        }

        /* ── Scrollbar ─────────────────────── */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        /* ── Agent chat ────────────────────── */
        .chat-btn {
            position: fixed;
            bottom: 29px;
            right: 24px;
            z-index: 9998;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid var(--primary);
            background: var(--primary);
            color: var(--bg);
            font-family: inherit;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s, transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-btn:hover { background: var(--primary-hover); transform: scale(1.05); }
        .chat-btn.open { background: var(--bg); color: var(--primary); border-color: var(--border); }

        .chat-panel {
            position: fixed;
            bottom: 84px;
            right: 24px;
            width: 420px;
            height: 520px;
            z-index: 9998;
            border: 1px solid var(--border);
            border-radius: var(--r);
            background: var(--bg);
            display: none;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.15, 1);
        }
        .chat-panel.visible { display: flex; }

        .chat-overlay {
            position: fixed;
            inset: 0;
            z-index: 9997;
            background: rgba(0,0,0,0.3);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.15, 1);
        }
        .chat-overlay.active { opacity: 1; pointer-events: auto; }

        .chat-panel.expanded {
            bottom: 0 !important;
            right: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 0;
            border: none;
            box-shadow: none;
            z-index: 9998;
        }

        .chat-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-header-model {
            font-size: 11px;
            font-weight: 400;
            color: var(--text-muted);
        }
        .chat-gear {
            background: none;
            border: none;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 3px;
            transition: color 0.15s;
        }
        .chat-gear:hover { color: var(--primary); }
        .chat-gear.active { color: var(--primary); }
        .chat-expand {
            background: none;
            border: none;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 3px;
            transition: color 0.15s;
        }
        .chat-expand:hover { color: var(--primary); }

        .chat-settings {
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            display: none;
            flex-direction: column;
            gap: 8px;
            background: var(--bg-secondary);
        }
        .chat-settings.visible { display: flex; }
        .chat-settings label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 700;
        }
        .chat-settings input {
            width: 100%;
            border: 1px dashed var(--border);
            border-radius: 4px;
            padding: 6px 8px;
            font-family: inherit;
            font-size: 11px;
            background: var(--bg);
            color: var(--text);
            outline: none;
            margin-top: 2px;
        }
        .chat-settings input:focus { border-color: var(--primary); }
        .chat-settings-btns {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }
        .chat-settings-status {
            font-size: 11px;
            color: var(--primary);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-msg {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: var(--r);
            font-size: 12px;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .chat-msg.user {
            align-self: flex-end;
            background: var(--primary);
            color: var(--bg);
        }
        .chat-msg.assistant {
            align-self: flex-start;
            background: var(--bg-secondary);
            color: var(--text);
            border: 1px solid var(--border-light);
            white-space: normal;
        }
        .chat-msg.assistant p { margin: 0 0 8px 0; }
        .chat-msg.assistant p:last-child { margin-bottom: 0; }
        .chat-msg.assistant ul, .chat-msg.assistant ol { margin: 4px 0 8px 18px; }
        .chat-msg.assistant li { margin-bottom: 2px; }
        .chat-msg.assistant code {
            background: rgba(0,0,0,0.06);
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 11px;
        }
        .chat-msg.assistant pre {
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 8px 10px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 6px 0;
            font-size: 11px;
            line-height: 1.5;
        }
        .chat-msg.assistant pre code {
            background: none;
            padding: 0;
            color: inherit;
            font-size: inherit;
        }
        .chat-msg.assistant h1, .chat-msg.assistant h2, .chat-msg.assistant h3 {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            margin: 8px 0 4px 0;
        }
        .chat-msg.assistant h1:first-child, .chat-msg.assistant h2:first-child, .chat-msg.assistant h3:first-child {
            margin-top: 0;
        }
        .chat-msg.assistant blockquote {
            border-left: 2px solid var(--border);
            padding-left: 8px;
            color: var(--text-muted);
            margin: 6px 0;
        }
        .chat-msg.assistant strong { font-weight: 700; }
        .chat-msg.assistant a { color: var(--primary); }
        .chat-msg.assistant table {
            border-collapse: collapse;
            margin: 6px 0;
            font-size: 11px;
            width: 100%;
        }
        .chat-msg.assistant th, .chat-msg.assistant td {
            border: 1px solid var(--border);
            padding: 4px 6px;
            text-align: left;
        }
        .chat-msg.assistant th { background: rgba(0,0,0,0.04); font-weight: 700; }
        .chat-msg.tool-info {
            align-self: flex-start;
            background: transparent;
            border: 1px dashed var(--border);
            color: var(--text-muted);
            font-size: 11px;
            padding: 6px 10px;
        }
        .chat-msg.error {
            align-self: flex-start;
            color: #a4343a;
            background: rgba(164,52,58,0.06);
            border: 1px solid rgba(164,52,58,0.15);
        }

        .chat-confirm {
            align-self: flex-start;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 10px 12px;
            max-width: 85%;
        }
        .chat-confirm-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }
        .chat-confirm-desc {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .chat-confirm-args {
            font-size: 11px;
            color: var(--text);
            margin-bottom: 8px;
            line-height: 1.7;
        }
        .chat-confirm-args .arg-key {
            color: var(--text-muted);
        }
        .chat-confirm-btns {
            display: flex;
            gap: 8px;
        }
        .chat-confirm-btns button {
            padding: 5px 14px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid var(--primary);
            transition: all 0.15s;
        }
        .btn-approve { background: var(--primary); color: var(--bg); }
        .btn-approve:hover { background: var(--primary-hover); }
        .btn-deny { background: transparent; color: var(--primary); }
        .btn-deny:hover { background: var(--bg-secondary); }

        .chat-input-bar {
            padding: 10px 12px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
        }
        .chat-input {
            flex: 1;
            border: 1px dashed var(--border);
            border-radius: 4px;
            padding: 8px 10px;
            font-family: inherit;
            font-size: 12px;
            background: var(--bg);
            color: var(--text);
            outline: none;
            resize: none;
        }
        .chat-input:focus { border-color: var(--primary); }
        .chat-send {
            padding: 8px 14px;
            border: 1px solid var(--primary);
            border-radius: 4px;
            background: var(--primary);
            color: var(--bg);
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .chat-send:hover { background: var(--primary-hover); }
        .chat-send:disabled { opacity: 0.5; cursor: not-allowed; }

        .chat-typing {
            align-self: flex-start;
            font-size: 11px;
            color: var(--text-muted);
            padding: 4px 0;
        }
        .chat-typing::after {
            content: '';
            animation: dots 1.2s steps(4) infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }

        .chat-needs-key {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            padding: 24px;
        }
    </style>
</head>
<body>

<div id="home" class="home">
    <div class="title"><span>&gt;_</span> workspace</div>
    <div class="grid" id="grid"></div>
</div>

<button class="btn-add" id="card-add">[+] browse marketplace</button>

<div id="frame" class="frame">
    <div class="bar-top">
        <button class="bar-back" id="back">[&lt;] workspace</button>
        <span class="bar-name" id="tool-name"></span>
        <span class="bar-spacer">[&lt;] workspace</span>
    </div>
    <iframe id="tool-iframe" class="tool-iframe"></iframe>
    <div class="bar-bottom"></div>
</div>

<div class="market-overlay" id="market-overlay">
    <div class="market-panel" id="market-panel">
        <div class="market-content">
            <div class="market-header">
                <div class="market-title">> marketplace_</div>
                <button class="market-close" id="market-close">[x] close</button>
            </div>
            <div id="market-body"></div>
        </div>
    </div>
</div>

<div class="chat-overlay" id="chat-overlay"></div>
<button class="chat-btn" id="chat-btn">&gt;_</button>
<div class="chat-panel" id="chat-panel">
    <div class="chat-header">
        <span>> agent_</span>
        <div class="chat-header-right">
            <span class="chat-header-model" id="chat-model"></span>
            <button class="chat-expand" id="chat-expand" onclick="toggleExpandChat()">[^]</button>
            <button class="chat-gear" id="chat-gear" onclick="toggleSettings()">[~]</button>
        </div>
    </div>
    <div class="chat-settings" id="chat-settings">
        <label>API key (OpenRouter)
            <input type="password" id="cfg-key" placeholder="sk-or-...">
        </label>
        <label>Model
            <input type="text" id="cfg-model">
        </label>
        <label>Base URL
            <input type="text" id="cfg-url">
        </label>
        <div class="chat-settings-btns">
            <button class="chat-send" onclick="saveAgentConfig()">[ok] save</button>
            <span class="chat-settings-status" id="cfg-status"></span>
        </div>
    </div>
    <div class="chat-messages" id="chat-msgs"></div>
    <div class="chat-input-bar">
        <textarea class="chat-input" id="chat-input" rows="1" placeholder="ask something..."></textarea>
        <button class="chat-send" id="chat-send" onclick="sendChat()">[>]</button>
    </div>
</div>

<script>
let tools = [];

async function init() {
    const r = await fetch('api/tools');
    tools = await r.json();
    renderGrid();
    route();
    window.addEventListener('popstate', route);
}

function renderGrid() {
    const grid = document.getElementById('grid');
    let html = '';
    for (const t of tools) {
        const closeBtn = `<button class="card-close" data-uninstall="${t.slug}">[x]</button>`;
        html += `
        <div class="card" data-slug="${t.slug}">
            ${closeBtn}
            <div class="card-name">[&gt;] ${t.slug}</div>
            <div class="card-desc">${t.description}</div>
            <div class="card-arrow">&rarr;</div>
        </div>`;
    }
    grid.innerHTML = html;

    grid.querySelectorAll('.card[data-slug]').forEach(card => {
        card.addEventListener('click', (e) => {
            if (e.target.closest('.card-close')) return;
            const slug = card.dataset.slug;
            history.pushState({tool: slug}, '', '?tool=' + slug);
            route();
        });
    });

    grid.querySelectorAll('.card-close[data-uninstall]').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            uninstallFromHome(btn.dataset.uninstall);
        });
    });
}

function route() {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('tool');
    if (slug) {
        openTool(slug);
    } else {
        closeTool();
    }
}

function openTool(slug) {
    const tool = tools.find(t => t.slug === slug);
    if (!tool) return;
    document.getElementById('home').classList.add('hidden');
    document.getElementById('frame').classList.add('active');
    document.getElementById('card-add').style.display = 'none';
    document.getElementById('tool-name').textContent = tool.name;
    const iframe = document.getElementById('tool-iframe');
    if (iframe.src !== tool.url) {
        iframe.src = tool.url;
    }
}

function closeTool() {
    document.getElementById('home').classList.remove('hidden');
    document.getElementById('frame').classList.remove('active');
    document.getElementById('card-add').style.display = '';
    document.getElementById('tool-iframe').src = '';
    document.getElementById('tool-name').textContent = '';
}

document.getElementById('back').addEventListener('click', () => {
    history.pushState({}, '', '?');
    route();
});

// ── Marketplace ─────────────────────────────────────

async function loadMarketplace() {
    const body = document.getElementById('market-body');
    body.innerHTML = '<div class="market-empty"><div class="ic">[..]</div><div class="h">loading...</div></div>';

    try {
        const r = await fetch('api/marketplace');
        const items = await r.json();

        if (items.length === 0) {
            body.innerHTML = '<div class="market-empty"><div class="ic">[ok]</div><div class="h">all tools installed</div></div>';
            return;
        }

        let html = '<div class="market-grid">';
        for (const item of items) {
            html += `
            <div class="market-card" id="mc-${item.slug}">
                <div class="market-card-name">${item.name}</div>
                <div class="market-card-desc">${item.description}</div>
                <div class="market-card-actions">
                    ${item.installed
                        ? `<button class="btn-uninstall" onclick="uninstallTool('${item.slug}')">[x] uninstall</button>`
                        : `<button class="btn-install" onclick="installTool('${item.slug}')">[+] install</button>`
                    }
                </div>
                <div class="market-card-status" id="ms-${item.slug}">
                    ${item.installed ? '[ok] running' : ''}
                </div>
            </div>`;
        }
        html += '</div>';
        body.innerHTML = html;
    } catch {
        body.innerHTML = '<div class="market-empty"><div class="ic">[!]</div><div class="h">failed to load</div></div>';
    }
}

function waitForTool(slug, maxAttempts) {
    let attempts = 0;
    return new Promise((resolve, reject) => {
        const check = () => {
            attempts++;
            fetch('/tools/' + slug + '/', { method: 'HEAD' })
                .then(r => { if (r.ok) resolve(); else throw 0; })
                .catch(() => {
                    if (attempts >= maxAttempts) reject();
                    else setTimeout(check, 1500);
                });
        };
        check();
    });
}

async function installTool(slug) {
    const card = document.getElementById('mc-' + slug);
    const actions = card.querySelector('.market-card-actions');
    const status = document.getElementById('ms-' + slug);

    actions.innerHTML = '<button class="btn-install" disabled><span class="spinner"></span>installing...</button>';
    status.textContent = '[..] building image...';

    try {
        const r = await fetch('api/install/' + slug, { method: 'POST' });
        const data = await r.json();

        if (!r.ok) {
            status.textContent = '[!] ' + (data.error || 'failed');
            actions.innerHTML = '<button class="btn-install" onclick="installTool(\'' + slug + '\')">[+] retry</button>';
            return;
        }

        status.textContent = '[..] waiting for container...';

        try {
            await waitForTool(slug, 20);
        } catch {
            status.textContent = '[!] container not responding';
            actions.innerHTML = '<button class="btn-install" onclick="installTool(\'' + slug + '\')">[+] retry</button>';
            return;
        }

        status.textContent = '[ok] ready';
        actions.innerHTML = '<button class="btn-uninstall" onclick="uninstallTool(\'' + slug + '\')">[x] uninstall</button>';

        const toolsR = await fetch('api/tools');
        tools = await toolsR.json();
        renderGrid();

        closeMarket();
    } catch {
        status.textContent = '[!] network error';
        actions.innerHTML = '<button class="btn-install" onclick="installTool(\'' + slug + '\')">[+] retry</button>';
    }
}

async function uninstallTool(slug) {
    const card = document.getElementById('mc-' + slug);
    const actions = card.querySelector('.market-card-actions');
    const status = document.getElementById('ms-' + slug);

    actions.innerHTML = '<button class="btn-uninstall" disabled><span class="spinner spinner-dark"></span>stopping...</button>';
    status.textContent = '[..] stopping container...';

    try {
        const r = await fetch('api/uninstall/' + slug, { method: 'POST' });
        const data = await r.json();

        if (r.ok) {
            status.textContent = '';
            actions.innerHTML = '<button class="btn-install" onclick="installTool(\'' + slug + '\')">[+] install</button>';

            const toolsR = await fetch('api/tools');
            tools = await toolsR.json();
            renderGrid();
        } else {
            status.textContent = '[!] ' + (data.error || 'failed');
            actions.innerHTML = '<button class="btn-uninstall" onclick="uninstallTool(\'' + slug + '\')">[x] retry</button>';
        }
    } catch {
        status.textContent = '[!] network error';
        actions.innerHTML = '<button class="btn-uninstall" onclick="uninstallTool(\'' + slug + '\')">[x] retry</button>';
    }
}

async function uninstallFromHome(slug) {
    const card = document.querySelector(`.card[data-slug="${slug}"]`);
    if (!card) return;
    card.style.opacity = '0.5';
    card.style.pointerEvents = 'none';

    try {
        const r = await fetch('api/uninstall/' + slug, { method: 'POST' });
        if (r.ok) {
            const toolsR = await fetch('api/tools');
            tools = await toolsR.json();
            renderGrid();
        } else {
            card.style.opacity = '';
            card.style.pointerEvents = '';
        }
    } catch {
        card.style.opacity = '';
        card.style.pointerEvents = '';
    }
}

// ── Marketplace expand animation ──────────────────

function openMarket() {
    const card = document.getElementById('card-add');
    const rect = card.getBoundingClientRect();
    const panel = document.getElementById('market-panel');
    const overlay = document.getElementById('market-overlay');

    panel.classList.remove('expanded');
    panel.style.top = rect.top + 'px';
    panel.style.left = rect.left + 'px';
    panel.style.width = rect.width + 'px';
    panel.style.height = rect.height + 'px';

    panel.classList.add('visible');
    overlay.classList.add('active');

    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            panel.style.top = '0';
            panel.style.left = '0';
            panel.style.width = '100vw';
            panel.style.height = '100vh';
            panel.classList.add('expanded');
        });
    });

    loadMarketplace();
}

function closeMarket() {
    const card = document.getElementById('card-add');
    const rect = card.getBoundingClientRect();
    const panel = document.getElementById('market-panel');
    const overlay = document.getElementById('market-overlay');

    panel.classList.remove('expanded');
    panel.style.top = rect.top + 'px';
    panel.style.left = rect.left + 'px';
    panel.style.width = rect.width + 'px';
    panel.style.height = rect.height + 'px';

    setTimeout(() => {
        overlay.classList.remove('active');
        panel.classList.remove('visible');
    }, 400);
}

document.getElementById('card-add').addEventListener('click', openMarket);
document.getElementById('market-close').addEventListener('click', closeMarket);
document.getElementById('market-overlay').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeMarket();
});

// ── Agent chat ─────────────────────────────────────

marked.setOptions({ gfm: true, breaks: true });

let chatSessionId = null;
let chatInited = false;

document.getElementById('chat-btn').addEventListener('click', () => {
    const panel = document.getElementById('chat-panel');
    const btn = document.getElementById('chat-btn');
    if (chatExpanded) toggleExpandChat();
    const open = panel.classList.toggle('visible');
    btn.classList.toggle('open', open);
    btn.textContent = open ? 'x' : '>_';
    if (open && !chatInited) initChat();
});

let chatExpanded = false;

function toggleExpandChat() {
    const panel = document.getElementById('chat-panel');
    const overlay = document.getElementById('chat-overlay');
    const btn = document.getElementById('chat-expand');
    chatExpanded = !chatExpanded;

    if (chatExpanded) {
        overlay.classList.add('active');
        panel.classList.add('expanded');
        btn.textContent = '[v]';
    } else {
        overlay.classList.remove('active');
        panel.classList.remove('expanded');
        btn.textContent = '[^]';
    }
}

document.getElementById('chat-overlay').addEventListener('click', () => {
    if (chatExpanded) toggleExpandChat();
});

async function initChat() {
    chatInited = true;
    const r = await fetch('api/agent/config');
    const cfg = await r.json();
    document.getElementById('chat-model').textContent = cfg.model || '';
    document.getElementById('cfg-model').value = cfg.model || 'deepseek/deepseek-chat-v3';
    document.getElementById('cfg-url').value = cfg.base_url || 'https://openrouter.ai/api/v1';

    if (!cfg.has_api_key) {
        document.getElementById('chat-settings').classList.add('visible');
        document.getElementById('chat-gear').classList.add('active');
        addMsg('tool-info', 'configure your API key in settings [~] to get started');
    }

    document.getElementById('chat-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
    });
}

function toggleSettings() {
    const s = document.getElementById('chat-settings');
    const g = document.getElementById('chat-gear');
    s.classList.toggle('visible');
    g.classList.toggle('active');
    document.getElementById('cfg-status').textContent = '';
}

async function saveAgentConfig() {
    const key = document.getElementById('cfg-key').value.trim();
    const model = document.getElementById('cfg-model').value.trim();
    const url = document.getElementById('cfg-url').value.trim();
    const payload = {};
    if (key) payload.api_key = key;
    if (model) payload.model = model;
    if (url) payload.base_url = url;
    await fetch('api/agent/config', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload),
    });
    document.getElementById('cfg-status').textContent = '[ok] saved';
    document.getElementById('chat-model').textContent = model || '';
    if (key) document.getElementById('cfg-key').value = '';
    setTimeout(() => {
        document.getElementById('chat-settings').classList.remove('visible');
        document.getElementById('chat-gear').classList.remove('active');
    }, 800);
}

function addMsg(type, content) {
    const msgs = document.getElementById('chat-msgs');
    const div = document.createElement('div');
    div.className = 'chat-msg ' + type;
    if (type === 'assistant') {
        div.innerHTML = marked.parse(content);
    } else {
        div.textContent = content;
    }
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
}

function fmtVal(v) {
    if (Array.isArray(v)) {
        if (v.length === 0) return '(empty list)';
        const names = v.map(i => i.name || i.title || '').filter(Boolean);
        if (names.length) return names.join(', ');
        return `${v.length} item${v.length > 1 ? 's' : ''}`;
    }
    if (typeof v === 'object' && v !== null) {
        const s = JSON.stringify(v);
        return s.length > 80 ? s.slice(0, 80) + '...' : s;
    }
    const s = String(v);
    return s.length > 120 ? s.slice(0, 120) + '...' : s;
}

function fmtArgs(args) {
    return Object.entries(args)
        .filter(([, v]) => v !== null && v !== undefined && v !== '')
        .map(([k, v]) => {
            const label = k.replace(/_/g, ' ');
            return `<span class="arg-key">${label}:</span> ${fmtVal(v)}`;
        })
        .join('<br>');
}

function addConfirm(data) {
    const msgs = document.getElementById('chat-msgs');
    const div = document.createElement('div');
    div.className = 'chat-confirm';
    div.innerHTML = `
        <div class="chat-confirm-title">[!] ${data.tool} > ${data.action.replace(/_/g, ' ')}</div>
        <div class="chat-confirm-args">${fmtArgs(data.args)}</div>
        <div class="chat-confirm-btns">
            <button class="btn-approve" onclick="confirmAction(true, this)">[ok] approve</button>
            <button class="btn-deny" onclick="confirmAction(false, this)">[x] deny</button>
        </div>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
    const msgs = document.getElementById('chat-msgs');
    const div = document.createElement('div');
    div.className = 'chat-typing';
    div.id = 'chat-typing';
    div.textContent = 'thinking';
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
}

function hideTyping() {
    const el = document.getElementById('chat-typing');
    if (el) el.remove();
}

async function sendChat() {
    const input = document.getElementById('chat-input');
    const msg = input.value.trim();
    if (!msg) return;
    input.value = '';
    addMsg('user', msg);
    showTyping();
    document.getElementById('chat-send').disabled = true;

    try {
        const r = await fetch('api/agent/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ message: msg, session_id: chatSessionId }),
        });
        hideTyping();
        if (!r.ok) { addMsg('error', 'server error: ' + r.status); }
        else {
            const data = await r.json();
            chatSessionId = data.session_id;
            handleResponse(data);
        }
    } catch (e) {
        hideTyping();
        addMsg('error', 'network error: ' + e.message);
    }
    document.getElementById('chat-send').disabled = false;
}

function handleResponse(data) {
    if (data.type === 'text') {
        addMsg('assistant', data.content);
    } else if (data.type === 'confirm') {
        addConfirm(data);
    } else if (data.type === 'error') {
        addMsg('error', data.content);
    }
}

async function confirmAction(approved, btn) {
    const btns = btn.closest('.chat-confirm-btns');
    btns.innerHTML = approved
        ? '<span style="font-size:11px;color:var(--primary)">[ok] approved</span>'
        : '<span style="font-size:11px;color:var(--text-muted)">[x] denied</span>';

    showTyping();
    try {
        const r = await fetch('api/agent/confirm', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ session_id: chatSessionId, approved }),
        });
        hideTyping();
        if (!r.ok) { addMsg('error', 'server error: ' + r.status); }
        else {
            const data = await r.json();
            handleResponse(data);
        }
    } catch (e) {
        hideTyping();
        addMsg('error', 'network error: ' + e.message);
    }
}

init();
</script>
