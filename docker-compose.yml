x-logging: &logging
  command: >-
    sh -c "find /app/logs -name '*.log' -mtime +3 -delete 2>/dev/null;
    exec uv run python app.py 2>&1 | tee -a /app/logs/$$(date +%Y-%m-%d).log"
  environment: &log-env
    PYTHONUNBUFFERED: "1"

services:
  nginx:
    image: nginx:alpine
    ports:
    - 8081:80
    volumes:
    - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
    - portal
    - calendar
    - email-reader
    - todolist
    - notes
    - kanban
  portal:
    build: .
    environment:
    - WORKSPACE_DOCKER=1
    - DOCKER_NETWORK=workspace_default
    - COMPOSE_PROJECT=workspace
    - HOST_TOOLS_DIR=${HOST_TOOLS_DIR:-${PWD}/tools}
    - PYTHONUNBUFFERED=1
    command: >-
      sh -c "find /app/logs -name '*.log' -mtime +3 -delete 2>/dev/null;
      exec ./start.sh 2>&1 | tee -a /app/logs/$$(date +%Y-%m-%d).log"
    volumes:
    - ./tools:/app/tools:ro
    - /var/run/docker.sock:/var/run/docker.sock
    - ./agent_config.yaml:/app/agent_config.yaml
    - ./logs/portal:/app/logs
  budget:
    build: ./tools/budget
    <<: *logging
    environment:
      <<: *log-env
    volumes:
    - ./tools/budget/data:/app/data
    - ./logs/budget:/app/logs
    profiles:
    - marketplace
  calendar:
    build: ./tools/calendar
    <<: *logging
    environment:
      <<: *log-env
    volumes:
    - ./tools/calendar/data:/app/data
    - ./logs/calendar:/app/logs
  email-reader:
    build: ./tools/email-reader
    <<: *logging
    environment:
      <<: *log-env
    volumes:
    - ./tools/email-reader/config.yaml:/app/config.yaml
    - ./tools/email-reader/data:/app/data
    - ./logs/email-reader:/app/logs
  job-tracker:
    build: ./tools/job-tracker
    <<: *logging
    environment:
      <<: *log-env
    volumes:
    - ./tools/job-tracker/config.yaml:/app/config.yaml
    - ./tools/job-tracker/data:/app/data
    - ./logs/job-tracker:/app/logs
    profiles:
    - marketplace
  notes:
    build: ./tools/notes
    <<: *logging
    environment:
      <<: *log-env
    volumes:
    - ./tools/notes/data:/app/data
    - ./logs/notes:/app/logs
  mock-tool:
    build: ./tools/mock-tool
    <<: *logging
    environment:
      <<: *log-env
    volumes:
    - ./tools/mock-tool/data:/app/data
    - ./logs/mock-tool:/app/logs
    profiles:
    - marketplace
  kanban:
    build: ./tools/kanban
    <<: *logging
    environment:
      <<: *log-env
    volumes:
    - ./tools/kanban/data:/app/data
    - ./logs/kanban:/app/logs
  todolist:
    build: ./tools/todolist
    <<: *logging
    environment:
      <<: *log-env
    volumes:
    - ./tools/todolist/data:/app/data
    - ./logs/todolist:/app/logs
