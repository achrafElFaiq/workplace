<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban Board</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

    :root {
        --bg: #fafaf5;
        --bg-secondary: #f0f0e8;
        --primary: #2d6a4f;
        --primary-hover: #1b4332;
        --text: #1a1a1a;
        --text-muted: #888888;
        --border: #d4d4c8;
        --border-light: #eeeeee;
        --r: 6px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        color: var(--text);
        background: var(--bg);
        height: 100vh;
        display: flex;
        overflow: hidden;
    }

    /* ── Sidebar ─────────────────────── */
    .sidebar {
        width: 240px;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        background: var(--bg-secondary);
        flex-shrink: 0;
    }
    .sidebar-header {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .sidebar-header .title {
        font-weight: 700;
        font-size: 12px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .sidebar-add {
        background: none;
        border: none;
        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        color: var(--text-muted);
        cursor: pointer;
        padding: 0 4px;
        border-radius: 3px;
        line-height: 1;
    }
    .sidebar-add:hover { color: var(--primary); }
    .sidebar-list { flex: 1; overflow-y: auto; }
    .sidebar-item {
        padding: 10px 12px;
        cursor: pointer;
        border-bottom: 1px solid var(--border-light);
        font-size: 12px;
        transition: background 0.1s;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
    }
    .sidebar-item:hover { background: rgba(45,106,79,0.06); }
    .sidebar-item.active { background: var(--bg); border-left: 2px solid var(--primary); }
    .sidebar-item .item-name {
        font-weight: 500;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
    }
    .sidebar-item .item-count {
        font-size: 11px;
        color: var(--text-muted);
        margin-left: 8px;
        flex-shrink: 0;
    }
    .dots-btn {
        background: none;
        border: none;
        cursor: pointer;
        padding: 2px 4px;
        font-size: 14px;
        color: var(--text-muted);
        line-height: 1;
        letter-spacing: 1px;
        flex-shrink: 0;
        margin-left: 4px;
    }
    .dots-btn:hover { color: var(--primary); }
    .ctx-menu {
        position: absolute;
        right: 8px;
        top: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--r);
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        z-index: 50;
        min-width: 140px;
        display: none;
    }
    .ctx-menu.visible { display: block; }
    .ctx-menu-item {
        padding: 7px 12px;
        font-size: 11px;
        cursor: pointer;
        color: var(--text);
        display: block;
        width: 100%;
        border: none;
        background: none;
        font-family: inherit;
        text-align: left;
    }
    .ctx-menu-item:hover { background: var(--bg-secondary); }
    .ctx-menu-item.danger { color: #a4343a; }
    .ctx-menu-item.danger:hover { background: rgba(164,52,58,0.06); }

    /* ── Main area ───────────────────── */
    .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .empty-state {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
        font-size: 12px;
        flex-direction: column;
        gap: 8px;
    }

    /* ── Board columns ───────────────── */
    .board {
        flex: 1;
        display: flex;
        gap: 0;
        overflow-x: auto;
    }

    .column {
        flex: 1;
        min-width: 240px;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
    }
    .column:last-child { border-right: none; }

    .column-header {
        padding: 12px 14px;
        font-size: 11px;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        background: var(--bg);
    }
    .column-header .count {
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1px 7px;
        font-size: 10px;
        font-weight: 400;
        margin-left: 6px;
    }
    .col-add-btn {
        background: none;
        border: none;
        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        color: var(--text-muted);
        cursor: pointer;
        padding: 0 4px;
        border-radius: 3px;
        transition: color 0.15s;
        line-height: 1;
    }
    .col-add-btn:hover { color: var(--primary); }

    .column-body {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: var(--bg-secondary);
        min-height: 100px;
        transition: background 0.2s;
    }
    .column-body.drag-over { background: #e8f0e8; }

    /* ── Ticket card ─────────────────── */
    .ticket {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--r);
        padding: 10px 12px;
        cursor: grab;
        transition: box-shadow 0.2s, transform 0.2s, opacity 0.2s;
    }
    .ticket:hover {
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        transform: translateY(-1px);
    }
    .ticket.dragging { opacity: 0.4; transform: scale(0.95); }
    .ticket-id { font-size: 10px; color: var(--text-muted); margin-bottom: 3px; }
    .ticket-title { font-size: 12px; font-weight: 700; color: var(--text); line-height: 1.4; margin-bottom: 6px; }
    .ticket-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .ticket-priority {
        font-size: 9px;
        font-weight: 700;
        padding: 1px 5px;
        border-radius: 3px;
        text-transform: uppercase;
    }
    .priority-low { background: #e8f5e9; color: #2e7d32; }
    .priority-medium { background: #fff3e0; color: #e65100; }
    .priority-high { background: #fce4ec; color: #c62828; }
    .priority-urgent { background: #c62828; color: #fff; }
    .ticket-assignee { font-size: 10px; color: var(--text-muted); margin-left: auto; }
    .ticket-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
    .ticket-tag {
        font-size: 9px;
        padding: 1px 5px;
        border-radius: 3px;
        background: var(--bg-secondary);
        border: 1px solid var(--border-light);
        color: var(--text-muted);
    }

    .drop-placeholder {
        border: 2px dashed var(--primary);
        border-radius: var(--r);
        height: 50px;
        background: rgba(45,106,79,0.05);
    }

    /* ── Modal ────────────────────────── */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.35);
        z-index: 1000;
        display: none;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.25s;
    }
    .modal-overlay.visible { display: flex; opacity: 1; }
    .modal {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--r);
        width: 520px;
        max-width: 90vw;
        max-height: 85vh;
        overflow-y: auto;
        transform: translateY(20px);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.15, 1);
        box-shadow: 0 16px 48px rgba(0,0,0,0.12);
    }
    .modal-overlay.visible .modal { transform: translateY(0); }
    .modal-header {
        padding: 18px 20px 0;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
    }
    .modal-ticket-id { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .modal-close {
        background: none;
        border: none;
        font-family: inherit;
        font-size: 12px;
        font-weight: 700;
        color: var(--text-muted);
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 3px;
        flex-shrink: 0;
    }
    .modal-close:hover { color: var(--primary); }
    .modal-body { padding: 14px 20px 20px; }
    .modal-field { margin-bottom: 14px; }
    .modal-field label {
        display: block;
        font-size: 11px;
        font-weight: 700;
        color: var(--text-muted);
        margin-bottom: 4px;
        text-transform: uppercase;
    }
    .modal-field input,
    .modal-field textarea,
    .modal-field select {
        width: 100%;
        border: 1px dashed var(--border);
        border-radius: 4px;
        padding: 7px 10px;
        font-family: inherit;
        font-size: 12px;
        background: var(--bg);
        color: var(--text);
        outline: none;
    }
    .modal-field input:focus,
    .modal-field textarea:focus,
    .modal-field select:focus { border-color: var(--primary); border-style: solid; }
    .modal-field textarea { min-height: 80px; resize: vertical; }
    .modal-footer {
        padding: 0 20px 18px;
        display: flex;
        gap: 8px;
        justify-content: space-between;
    }
    .modal-footer-left { display: flex; gap: 8px; }

    .btn {
        padding: 5px 12px;
        border: 1px solid var(--primary);
        border-radius: var(--r);
        background: transparent;
        color: var(--primary);
        font-family: inherit;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.15s;
    }
    .btn:hover { background: var(--primary); color: var(--bg); }
    .btn-primary { background: var(--primary); color: var(--bg); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { border-color: #c0392b; color: #c0392b; }
    .btn-danger:hover { background: #c0392b; color: var(--bg); }
</style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <span class="title">Boards</span>
        <button class="sidebar-add" onclick="promptNewBoard()" title="New board">[+]</button>
    </div>
    <div class="sidebar-list" id="board-list"></div>
</div>

<div class="main" id="main">
    <div class="empty-state" id="empty-state">select or create a board</div>
    <div class="board" id="board" style="display:none;">
        <div class="column" data-status="todo">
            <div class="column-header">
                <span>To Do <span class="count" id="count-todo">0</span></span>
                <button class="col-add-btn" onclick="openNewTicketModal()" title="New ticket">[+]</button>
            </div>
            <div class="column-body" id="col-todo"></div>
        </div>
        <div class="column" data-status="in_progress">
            <div class="column-header">
                <span>In Progress <span class="count" id="count-in_progress">0</span></span>
            </div>
            <div class="column-body" id="col-in_progress"></div>
        </div>
        <div class="column" data-status="review">
            <div class="column-header">
                <span>Review <span class="count" id="count-review">0</span></span>
            </div>
            <div class="column-body" id="col-review"></div>
        </div>
        <div class="column" data-status="done">
            <div class="column-header">
                <span>Done <span class="count" id="count-done">0</span></span>
            </div>
            <div class="column-body" id="col-done"></div>
        </div>
    </div>
</div>

<!-- Board name modal -->
<div class="modal-overlay" id="board-modal-overlay">
    <div class="modal" style="width:360px;">
        <div class="modal-header">
            <div><div class="modal-ticket-id" id="board-modal-label">new board</div></div>
            <button class="modal-close" onclick="closeBoardModal()">[x]</button>
        </div>
        <div class="modal-body">
            <div class="modal-field">
                <label>Name</label>
                <input type="text" id="board-modal-name" placeholder="board name...">
            </div>
        </div>
        <div class="modal-footer">
            <div class="modal-footer-left">
                <button class="btn btn-primary" onclick="submitBoardModal()">[ok] save</button>
                <button class="btn" onclick="closeBoardModal()">[x] cancel</button>
            </div>
            <div></div>
        </div>
    </div>
</div>

<!-- Confirm modal -->
<div class="modal-overlay" id="confirm-modal-overlay">
    <div class="modal" style="width:360px;">
        <div class="modal-body" style="padding:20px;">
            <p id="confirm-modal-text" style="margin-bottom:16px;">Are you sure?</p>
            <div style="display:flex;gap:8px;">
                <button class="btn btn-danger" onclick="confirmModalYes()">[ok] confirm</button>
                <button class="btn" onclick="closeConfirmModal()">[x] cancel</button>
            </div>
        </div>
    </div>
</div>

<!-- Ticket Modal -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
        <div class="modal-header">
            <div><div class="modal-ticket-id" id="modal-tid"></div></div>
            <button class="modal-close" onclick="closeModal()">[x] close</button>
        </div>
        <div class="modal-body">
            <div class="modal-field">
                <label>Title</label>
                <input type="text" id="modal-title">
            </div>
            <div class="modal-field">
                <label>Description</label>
                <textarea id="modal-desc"></textarea>
            </div>
            <div style="display:flex;gap:12px;">
                <div class="modal-field" style="flex:1;">
                    <label>Status</label>
                    <select id="modal-status">
                        <option value="todo">To Do</option>
                        <option value="in_progress">In Progress</option>
                        <option value="review">Review</option>
                        <option value="done">Done</option>
                    </select>
                </div>
                <div class="modal-field" style="flex:1;">
                    <label>Priority</label>
                    <select id="modal-priority">
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                        <option value="urgent">Urgent</option>
                    </select>
                </div>
            </div>
            <div style="display:flex;gap:12px;">
                <div class="modal-field" style="flex:1;">
                    <label>Assignee</label>
                    <input type="text" id="modal-assignee" placeholder="name...">
                </div>
                <div class="modal-field" style="flex:1;">
                    <label>Tags</label>
                    <input type="text" id="modal-tags" placeholder="bug, frontend...">
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <div class="modal-footer-left">
                <button class="btn btn-primary" onclick="saveModal()">[ok] save</button>
                <button class="btn" onclick="closeModal()">[x] cancel</button>
            </div>
            <button class="btn btn-danger" id="modal-delete-btn" onclick="deleteFromModal()">[x] delete</button>
        </div>
    </div>
</div>

<script>
let boards = [];
let tickets = [];
let currentBoard = null;
let draggedId = null;
let modalTicketId = null;
let isNewTicket = false;

// ── Boards ─────────────────────────

async function loadBoards() {
    const r = await fetch('api/boards');
    boards = await r.json();
    renderBoardList();
}

function renderBoardList() {
    const list = document.getElementById('board-list');
    let html = '';
    for (const b of boards) {
        const active = currentBoard && currentBoard.id === b.id ? ' active' : '';
        html += `
        <div class="sidebar-item${active}" data-bid="${b.id}" onclick="selectBoard('${b.id}')">
            <span class="item-name">${esc(b.name)}</span>
            <span class="item-count">${b.ticket_count}</span>
            <button class="dots-btn" onclick="event.stopPropagation();toggleCtxMenu('${b.id}')">⋮</button>
            <div class="ctx-menu" id="ctx-${b.id}">
                <button class="ctx-menu-item" onclick="event.stopPropagation();renameBoard('${b.id}','${esc(b.name)}')">rename</button>
                <button class="ctx-menu-item danger" onclick="event.stopPropagation();deleteBoard('${b.id}')">delete</button>
            </div>
        </div>`;
    }
    list.innerHTML = html;
}

function toggleCtxMenu(bid) {
    closeAllMenus();
    const menu = document.getElementById('ctx-' + bid);
    if (menu) menu.classList.toggle('visible');
}

function closeAllMenus() {
    document.querySelectorAll('.ctx-menu').forEach(m => m.classList.remove('visible'));
}

document.addEventListener('click', closeAllMenus);

async function selectBoard(bid) {
    currentBoard = boards.find(b => b.id === bid);
    if (!currentBoard) return;
    renderBoardList();
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('board').style.display = 'flex';
    await loadTickets();
}

let boardModalMode = null;
let boardModalBid = null;
let confirmCallback = null;

function openBoardModal(mode, bid, oldName) {
    boardModalMode = mode;
    boardModalBid = bid || null;
    document.getElementById('board-modal-label').textContent = mode === 'rename' ? 'rename board' : 'new board';
    document.getElementById('board-modal-name').value = oldName || '';
    const o = document.getElementById('board-modal-overlay');
    o.style.display = 'flex';
    requestAnimationFrame(() => o.classList.add('visible'));
    setTimeout(() => document.getElementById('board-modal-name').focus(), 100);
}

function closeBoardModal() {
    const o = document.getElementById('board-modal-overlay');
    o.classList.remove('visible');
    setTimeout(() => { o.style.display = 'none'; }, 250);
}

async function submitBoardModal() {
    const name = document.getElementById('board-modal-name').value.trim();
    if (!name) { document.getElementById('board-modal-name').focus(); return; }

    if (boardModalMode === 'rename' && boardModalBid) {
        await fetch(`api/boards/${boardModalBid}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name }),
        });
        closeBoardModal();
        await loadBoards();
    } else {
        const r = await fetch('api/boards', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name }),
        });
        const data = await r.json();
        closeBoardModal();
        await loadBoards();
        selectBoard(data.id);
    }
}

document.getElementById('board-modal-name').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitBoardModal();
    if (e.key === 'Escape') closeBoardModal();
});

function promptNewBoard() { openBoardModal('create'); }

function renameBoard(bid, oldName) {
    closeAllMenus();
    openBoardModal('rename', bid, oldName);
}

function openConfirmModal(text, callback) {
    confirmCallback = callback;
    document.getElementById('confirm-modal-text').textContent = text;
    const o = document.getElementById('confirm-modal-overlay');
    o.style.display = 'flex';
    requestAnimationFrame(() => o.classList.add('visible'));
}

function closeConfirmModal() {
    confirmCallback = null;
    const o = document.getElementById('confirm-modal-overlay');
    o.classList.remove('visible');
    setTimeout(() => { o.style.display = 'none'; }, 250);
}

function confirmModalYes() {
    const cb = confirmCallback;
    closeConfirmModal();
    if (cb) cb();
}

function deleteBoard(bid) {
    closeAllMenus();
    openConfirmModal('Delete this board and all its tickets?', async () => {
        await fetch(`api/boards/${bid}`, { method: 'DELETE' });
        if (currentBoard && currentBoard.id === bid) {
            currentBoard = null;
            document.getElementById('board').style.display = 'none';
            document.getElementById('empty-state').style.display = 'flex';
        }
        await loadBoards();
    });
}

// ── Tickets ────────────────────────

async function loadTickets() {
    if (!currentBoard) return;
    const r = await fetch(`api/boards/${currentBoard.id}/tickets`);
    tickets = await r.json();
    renderColumns();
}

function renderColumns() {
    const groups = { todo: [], in_progress: [], review: [], done: [] };
    for (const t of tickets) {
        if (groups[t.status]) groups[t.status].push(t);
    }

    for (const [status, items] of Object.entries(groups)) {
        const col = document.getElementById('col-' + status);
        document.getElementById('count-' + status).textContent = items.length;

        let html = '';
        for (const t of items) {
            const tags = t.tags ? t.tags.split(',').map(s => s.trim()).filter(Boolean) : [];
            const tagsHtml = tags.map(tag => `<span class="ticket-tag">${esc(tag)}</span>`).join('');
            html += `
            <div class="ticket" draggable="true" data-id="${t.id}"
                 ondragstart="onDragStart(event)" ondragend="onDragEnd(event)"
                 onclick="openTicket('${t.id}')">
                <div class="ticket-id">${esc(t.ticket_id)}</div>
                <div class="ticket-title">${esc(t.title)}</div>
                <div class="ticket-meta">
                    <span class="ticket-priority priority-${t.priority}">${t.priority}</span>
                    ${t.assignee ? `<span class="ticket-assignee">${esc(t.assignee)}</span>` : ''}
                </div>
                ${tagsHtml ? `<div class="ticket-tags">${tagsHtml}</div>` : ''}
            </div>`;
        }
        col.innerHTML = html;
    }
}

function esc(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
}

// ── Drag and Drop ──────────────────

function onDragStart(e) {
    draggedId = e.currentTarget.dataset.id;
    e.currentTarget.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', draggedId);
}

function onDragEnd(e) {
    e.currentTarget.classList.remove('dragging');
    draggedId = null;
    document.querySelectorAll('.column-body').forEach(c => c.classList.remove('drag-over'));
    document.querySelectorAll('.drop-placeholder').forEach(p => p.remove());
}

document.querySelectorAll('.column-body').forEach(col => {
    col.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        col.classList.add('drag-over');
        if (!col.querySelector('.drop-placeholder')) {
            const ph = document.createElement('div');
            ph.className = 'drop-placeholder';
            col.appendChild(ph);
        }
    });
    col.addEventListener('dragleave', (e) => {
        if (!col.contains(e.relatedTarget)) {
            col.classList.remove('drag-over');
            col.querySelectorAll('.drop-placeholder').forEach(p => p.remove());
        }
    });
    col.addEventListener('drop', async (e) => {
        e.preventDefault();
        col.classList.remove('drag-over');
        col.querySelectorAll('.drop-placeholder').forEach(p => p.remove());
        const id = e.dataTransfer.getData('text/plain');
        const newStatus = col.id.replace('col-', '');
        const ticket = tickets.find(t => t.id === id);
        if (!ticket || ticket.status === newStatus) return;
        ticket.status = newStatus;
        renderColumns();
        await fetch(`api/tickets/${id}/move`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: newStatus }),
        });
        await loadTickets();
        await loadBoards();
    });
});

// ── Ticket modal ───────────────────

function openTicket(id) {
    const t = tickets.find(x => x.id === id);
    if (!t) return;
    isNewTicket = false;
    modalTicketId = t.id;
    document.getElementById('modal-tid').textContent = t.ticket_id;
    document.getElementById('modal-title').value = t.title;
    document.getElementById('modal-desc').value = t.description || '';
    document.getElementById('modal-status').value = t.status;
    document.getElementById('modal-priority').value = t.priority;
    document.getElementById('modal-assignee').value = t.assignee || '';
    document.getElementById('modal-tags').value = t.tags || '';
    document.getElementById('modal-delete-btn').style.display = '';
    showModal();
}

function openNewTicketModal() {
    if (!currentBoard) return;
    isNewTicket = true;
    modalTicketId = null;
    document.getElementById('modal-tid').textContent = 'new ticket';
    document.getElementById('modal-title').value = '';
    document.getElementById('modal-desc').value = '';
    document.getElementById('modal-status').value = 'todo';
    document.getElementById('modal-priority').value = 'medium';
    document.getElementById('modal-assignee').value = '';
    document.getElementById('modal-tags').value = '';
    document.getElementById('modal-delete-btn').style.display = 'none';
    showModal();
    setTimeout(() => document.getElementById('modal-title').focus(), 100);
}

function showModal() {
    const o = document.getElementById('modal-overlay');
    o.style.display = 'flex';
    requestAnimationFrame(() => o.classList.add('visible'));
}

function closeModal() {
    const o = document.getElementById('modal-overlay');
    o.classList.remove('visible');
    setTimeout(() => { o.style.display = 'none'; }, 250);
}

async function saveModal() {
    const data = {
        title: document.getElementById('modal-title').value.trim(),
        description: document.getElementById('modal-desc').value,
        status: document.getElementById('modal-status').value,
        priority: document.getElementById('modal-priority').value,
        assignee: document.getElementById('modal-assignee').value.trim(),
        tags: document.getElementById('modal-tags').value.trim(),
    };
    if (!data.title) { document.getElementById('modal-title').focus(); return; }

    if (isNewTicket) {
        await fetch(`api/boards/${currentBoard.id}/tickets`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
        });
    } else {
        await fetch(`api/tickets/${modalTicketId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
        });
    }
    closeModal();
    await loadTickets();
    await loadBoards();
}

async function deleteFromModal() {
    if (!modalTicketId) return;
    await fetch(`api/tickets/${modalTicketId}`, { method: 'DELETE' });
    closeModal();
    await loadTickets();
    await loadBoards();
}

// ── Keyboard & overlay close ───────

document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeModal();
});
document.getElementById('board-modal-overlay').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeBoardModal();
});
document.getElementById('confirm-modal-overlay').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeConfirmModal();
});
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeModal(); closeBoardModal(); closeConfirmModal(); }
});

// ── Init ───────────────────────────

loadBoards();
</script>
